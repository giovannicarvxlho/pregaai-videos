<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Capa: A crucificação</title>
<style>
@font-face { font-family: 'Gasoek One'; src: url(../../node_modules/@expo-google-fonts/gasoek-one/400Regular/GasoekOne_400Regular.ttf); }
html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #FFE9D6; }
#root { position: relative; width: 1080px; height: 1920px; overflow: hidden; -webkit-font-smoothing: antialiased; }
svg { position: absolute; inset: 0; }
/* O texto completa o título ("Provocaram Jesus a descer da cruz") em vez de repeti-lo:
   ele não desceu (Mateus 27:40; João 10:18). O rosto é o do centurião, aterrorizado (Mateus 27:54).
   Tudo o que importa fica no miolo 3:4 (y 240 a 1680), o recorte da grade do TikTok. */
.hook { position: absolute; left: 0; right: 0; top: 290px; display: flex; flex-direction: column; align-items: center; }
.l { font: 400 200px/0.95 'Gasoek One'; color: #181614; text-shadow: 0 12px 0 #FFFFFF; white-space: nowrap; }
.chip { margin-top: 26px; padding: 6px 46px 30px; background: #2383E2; border: 8px solid #181614; border-radius: 40px; box-shadow: 0 18px 0 0 #181614;
  font: 400 190px/1 'Gasoek One'; color: #FFFFFF; white-space: nowrap; transform: rotate(-4deg); }
</style>
</head>
<body>
<div id="root"><svg id="art" viewBox="0 0 1080 1920" width="1080" height="1920"></svg>
  <div class="hook"><div class="l">ELE</div><div class="chip">FICOU</div></div>
</div>
<script src="../../lib.js"></script>
<script>
const INK = '#181614';
let s = `<defs>
  ${skyGrad('bg', [[0, '#FFF6EC'], [0.55, '#FFE1C6'], [1, '#FFB98A']])}
  ${radial('burst', '#FFFFFF', 1)}
</defs><rect width="1080" height="1920" fill="url(#bg)"/>`;
// raios saindo do rosto: levam o olho para ele
const FX = 690, FY = 1290;
for (let i = 0; i < 20; i++) {
  const a = (i / 20) * Math.PI * 2;
  s += `<path d="M ${FX} ${FY} L ${FX + Math.cos(a - 0.07) * 1600} ${FY + Math.sin(a - 0.07) * 1600} L ${FX + Math.cos(a + 0.07) * 1600} ${FY + Math.sin(a + 0.07) * 1600} Z" fill="#FFFFFF" opacity="${i % 2 ? 0.0 : 0.55}"/>`;
}
s += `<circle cx="${FX}" cy="${FY}" r="420" fill="url(#burst)" opacity="0.9"/>`;
// a cruz em silhueta atrás, e o centurião de perto, aterrorizado, olhando para a seta
s += `<g transform="translate(918 1215) scale(0.8)"><rect x="-15" y="-530" width="30" height="530" fill="${INK}"/><rect x="-162" y="-442" width="324" height="28" fill="${INK}"/><rect x="-42" y="-524" width="84" height="34" fill="${INK}"/></g>`;
s += person({ ...man(821), skin: '#A86B3C', cover: null, beard: false, robe: '#8E3B46', x: FX, y: FY + 206 * 3.6, s: 3.6, mood: 'fear', t: 0.35, look: -1, armL: 14, armR: 14, gear: { helmet: 'cent', armor: true }, noShadow: true });
// seta grande, amarela e vermelha, com contorno preto, vindo do alto à esquerda até o rosto
const ang = 30, tipX = FX - 215, tipY = FY - 20;
for (let i = 0; i < 3; i++) {
  const r = (ang * Math.PI) / 180, back = 560 + i * 60, off = (i - 1) * 60;
  const x1 = tipX - Math.cos(r) * back - Math.sin(r) * off, y1 = tipY - Math.sin(r) * back + Math.cos(r) * off;
  const x2 = tipX - Math.cos(r) * (back + 200) - Math.sin(r) * off, y2 = tipY - Math.sin(r) * (back + 200) + Math.cos(r) * off;
  s += `<line x1="${f1(x1)}" y1="${f1(y1)}" x2="${f1(x2)}" y2="${f1(y2)}" stroke="${INK}" stroke-width="12" stroke-linecap="round"/>`;
}
s += `<g transform="translate(${tipX} ${tipY}) rotate(${ang})">
  <path d="M -520 -34 L -150 -34 L -150 -92 L 0 0 L -150 92 L -150 34 L -520 34 Z" fill="${C.a300}" stroke="${INK}" stroke-width="12" stroke-linejoin="round"/>
  <path d="M -150 -92 L 0 0 L -150 92 Z" fill="${C.r600}" stroke="${INK}" stroke-width="12" stroke-linejoin="round"/>
</g>`;
document.getElementById('art').innerHTML = s;
window.ready = document.fonts.ready;
</script>
</body>
</html>
