<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Capa: a mulher do fluxo de sangue</title>
<style>
@font-face { font-family: 'Gasoek One'; src: url(../../node_modules/@expo-google-fonts/gasoek-one/400Regular/GasoekOne_400Regular.ttf); }
html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #EDE3D6; }
#root { position: relative; width: 1080px; height: 1920px; overflow: hidden; -webkit-font-smoothing: antialiased; }
svg { position: absolute; inset: 0; }
/* Título: "A mulher que tocou em Jesus". A capa soma, não repete: "ELA ERA IMPURA" (Levítico 15:25).
   Dia, fundo claro e calmo; um herói só: a mulher de perto, estendendo a mão. Tudo no miolo 3:4. */
.hook { position: absolute; left: 0; right: 0; top: 300px; display: flex; flex-direction: column; align-items: center; }
.l { font: 400 170px/0.95 'Gasoek One'; color: #181614; white-space: nowrap; }
.chip { margin-top: 26px; padding: 6px 46px 30px; background: #2383E2; border: 8px solid #181614; border-radius: 40px; box-shadow: 0 18px 0 0 #181614;
  font: 400 170px/1 'Gasoek One'; color: #FFFFFF; white-space: nowrap; transform: rotate(-4deg); }
</style>
</head>
<body>
<div id="root"><svg id="art" viewBox="0 0 1080 1920" width="1080" height="1920"></svg>
  <div class="hook"><div class="l">ELA ERA</div><div class="chip">IMPURA</div></div>
</div>
<script src="../../lib.js"></script>
<script>
let s = DEFS + `<rect width="1080" height="1920" fill="#EDE3D6"/>`;
s += `<circle cx="540" cy="1500" r="720" fill="url(#gAmber)" opacity="0.35"/>`;
s += person({ robe: C.g600, skin: '#C68B59', hair: '#3A2A20', beard: false, cover: '#E2D8CF', x: 470, y: 1940, s: 3.1, mood: 'sad', look: 0.8, armR: 70, noShadow: true });
document.getElementById('art').innerHTML = s;
window.ready = document.fonts.ready;
</script>
</body>
</html>
