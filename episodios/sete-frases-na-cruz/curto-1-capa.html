<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Capa do curto do Instagram: as 7 frases de Jesus</title>
<style>
@font-face { font-family: 'Gasoek One'; src: url(../../node_modules/@expo-google-fonts/gasoek-one/400Regular/GasoekOne_400Regular.ttf); }
html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #111; }
#root { position: relative; width: 1080px; height: 1920px; overflow: hidden; -webkit-font-smoothing: antialiased; }
svg { position: absolute; inset: 0; }
/* Curto 1 (Instagram, recorte vertical do longo): a arte da miniatura N3 (a cruz do meio, grande, na luz das trevas), sem o texto dela,
   recortada em 9:16 em volta da cruz. O nome fica no terço de cima (y 250), dentro do miolo 3:4 (y 240 a 1680); o canto de baixo à esquerda fica livre. */
.hook { position: absolute; left: 0; right: 0; top: 250px; display: flex; flex-direction: column; align-items: center; }
.l { font: 400 190px/0.95 'Gasoek One'; letter-spacing: -3px; color: #FFE45C; white-space: nowrap;
  text-shadow: -7px -7px 0 #181614, 7px -7px 0 #181614, -7px 7px 0 #181614, 7px 7px 0 #181614, 0 -8px 0 #181614, 0 8px 0 #181614, -8px 0 0 #181614, 8px 0 0 #181614, 0 17px 0 #181614; }
.w { font: 400 120px/1 'Gasoek One'; color: #FFFFFF; white-space: nowrap; margin: 0 0 6px;
  text-shadow: -6px -6px 0 #181614, 6px -6px 0 #181614, -6px 6px 0 #181614, 6px 6px 0 #181614, 0 -7px 0 #181614, 0 7px 0 #181614, -7px 0 0 #181614, 7px 0 0 #181614, 0 14px 0 #181614; }
.chip { padding: 6px 34px 22px; background: #2383E2; border: 8px solid #181614; border-radius: 32px; box-shadow: 0 14px 0 0 #181614; font: 400 104px/1 'Gasoek One'; color: #FFFFFF; white-space: nowrap; transform: rotate(-3deg); margin: 26px 0 0; }
</style>
</head>
<body>
<div id="root"><svg id="art" viewBox="656 0 607.5 1080" width="1080" height="1920" preserveAspectRatio="xMidYMid slice"></svg>
  <div class="hook"><div class="w">AS ÚLTIMAS</div><div class="l">7 FRASES</div><div class="chip">DE JESUS</div></div>
</div>
