<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Capa: As 7 frases na cruz (Short)</title>
<style>
@font-face { font-family: 'Gasoek One'; src: url(../../node_modules/@expo-google-fonts/gasoek-one/400Regular/GasoekOne_400Regular.ttf); }
html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #0E0B0A; }
#root { position: relative; width: 1080px; height: 1920px; overflow: hidden; -webkit-font-smoothing: antialiased; }
svg { position: absolute; inset: 0; }
/* Ligada ao título ("Quais foram as 7 frases de Jesus na cruz?"): a capa responde com o detalhe do vídeo,
   sem repetir o título, e é o mesmo gancho do primeiro quadro. Regra de 03/11: um herói só (a cruz em
   silhueta), fundo escuro porque é a morte de Jesus, o azul da marca no destaque.
   Tudo o que importa fica no miolo 3:4 (y 240 a 1680), o recorte da grade do perfil. */
.hook { position: absolute; left: 0; right: 0; top: 300px; display: flex; flex-direction: column; align-items: center; }
.l { font: 400 84px/1 'Gasoek One'; color: #FFFFFF; -webkit-text-stroke: 12px #0A0706; paint-order: stroke fill; white-space: nowrap; }
.chip { margin-top: 26px; padding: 6px 44px 26px; background: #2383E2; border: 8px solid #0A0706; border-radius: 38px; box-shadow: 0 16px 0 0 #0A0706;
  font: 400 170px/1 'Gasoek One'; color: #FFFFFF; white-space: nowrap; transform: rotate(-4deg); }
</style>
</head>
<body>
<div id="root"><svg id="art" viewBox="0 0 1080 1920" width="1080" height="1920"></svg>
  <div class="hook"><div class="l">NENHUM EVANGELHO</div><div class="chip">TEM AS 7</div></div>
</div>
<script src="../../lib.js"></script>
<script>
let s = `<defs>${skyGrad('bg', [[0, '#0E0B0A'], [0.55, '#2A1712'], [1, '#4A2418']])}${radial('glow', C.a300, 0.95)}${radial('core', '#FFFFFF', 1)}</defs>`;
s += `<rect width="1080" height="1920" fill="url(#bg)"/>`;
// a luz atrás da cabeça, com poucos raios: é o que leva o olho até a cruz
const HX = 540, HY = 880;
for (let i = 0; i < 14; i++) {
  const a = (i / 14) * Math.PI * 2;
  s += `<path d="M ${HX} ${HY} L ${f1(HX + Math.cos(a - 0.07) * 1800)} ${f1(HY + Math.sin(a - 0.07) * 1800)} L ${f1(HX + Math.cos(a + 0.07) * 1800)} ${f1(HY + Math.sin(a + 0.07) * 1800)} Z" fill="#FFD9A8" opacity="0.13"/>`;
}
s += `<circle cx="${HX}" cy="${HY}" r="520" fill="url(#glow)" opacity="0.9"/><circle cx="${HX}" cy="${HY}" r="200" fill="url(#core)"/>`;
s += hill(540, 1690, 900, '#140D0A', '#050302');
s += crossFig(540, 1720, 1.9, { fill: '#0D0907', rim: C.a300, plaque: true });
document.getElementById('art').innerHTML = s;
window.ready = document.fonts.ready;
</script>
</body>
</html>
