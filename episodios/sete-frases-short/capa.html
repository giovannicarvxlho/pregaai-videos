<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Capa: As 7 frases na cruz (Short)</title>
<style>
@font-face { font-family: 'Gasoek One'; src: url(../../node_modules/@expo-google-fonts/gasoek-one/400Regular/GasoekOne_400Regular.ttf); }
html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #FFE9D6; }
#root { position: relative; width: 1080px; height: 1920px; overflow: hidden; -webkit-font-smoothing: antialiased; }
svg { position: absolute; inset: 0; }
/* O título pergunta ("Quais foram as 7 frases de Jesus na cruz?") e a capa completa com a pista:
   nenhum evangelho tem as sete, só juntando os quatro (Mt 27:46; Mc 15:34; Lc 23; Jo 19).
   Tudo o que importa fica no miolo 3:4 (y 240 a 1680), o recorte da grade do TikTok. */
.hook { position: absolute; left: 0; right: 0; top: 290px; display: flex; flex-direction: column; align-items: center; }
.l { font: 400 124px/0.95 'Gasoek One'; color: #181614; text-shadow: 0 12px 0 #FFFFFF; white-space: nowrap; }
.chip { margin-top: 26px; padding: 6px 46px 30px; background: #2383E2; border: 8px solid #181614; border-radius: 40px; box-shadow: 0 18px 0 0 #181614;
  font: 400 190px/1 'Gasoek One'; color: #FFFFFF; white-space: nowrap; transform: rotate(-4deg); }
</style>
</head>
<body>
<div id="root"><svg id="art" viewBox="0 0 1080 1920" width="1080" height="1920"></svg>
  <div class="hook"><div class="l">SÓ JUNTANDO</div><div class="chip">OS 4</div></div>
</div>
<script src="../../lib.js"></script>
<script>
const INK = '#181614';
let s = `<defs>
  ${skyGrad('bg', [[0, '#FFF6EC'], [0.55, '#FFE1C6'], [1, '#FFB98A']])}
  ${radial('burst', '#FFFFFF', 1)}
</defs><rect width="1080" height="1920" fill="url(#bg)"/>`;
// raios saindo do rosto: levam o olho para ele
const FX = 690, FY = 1290;
for (let i = 0; i < 20; i++) {
  const a = (i / 20) * Math.PI * 2;
  s += `<path d="M ${FX} ${FY} L ${FX + Math.cos(a - 0.07) * 1600} ${FY + Math.sin(a - 0.07) * 1600} L ${FX + Math.cos(a + 0.07) * 1600} ${FY + Math.sin(a + 0.07) * 1600} Z" fill="#FFFFFF" opacity="${i % 2 ? 0.0 : 0.55}"/>`;
}
s += `<circle cx="${FX}" cy="${FY}" r="420" fill="url(#burst)" opacity="0.9"/>`;
// um escriba de perto, em choque, com o rolo aberto nas mãos
s += person({ robe: C.g500, skin: '#B97A4A', hair: '#2F2622', cover: '#E2D8CF', beard: true, x: FX, y: FY + 206 * 3.6, s: 3.6, mood: 'fear', t: 0.35, look: -1, armL: 40, armR: 40, noShadow: true });
const sy = FY + 330;
s += `<g transform="translate(${FX} ${sy})"><rect x="-300" y="-70" width="600" height="150" rx="10" fill="#F4EBDD" stroke="${INK}" stroke-width="10"/>`;
for (let k = 0; k < 4; k++) s += `<line x1="-240" y1="${-30 + k * 30}" x2="${k % 2 ? 180 : 240}" y2="${-30 + k * 30}" stroke="${C.g600}" stroke-width="10" stroke-linecap="round"/>`;
s += `<rect x="-340" y="-90" width="56" height="190" rx="28" fill="${C.wood}" stroke="${INK}" stroke-width="10"/><rect x="284" y="-90" width="56" height="190" rx="28" fill="${C.wood}" stroke="${INK}" stroke-width="10"/></g>`;
// seta amarela e vermelha apontando para o rosto (sem marcas de impacto: aqui ela só guia o olho)
const ang = 34, tipX = FX - 175, tipY = FY - 40;
for (let i = 0; i < 3; i++) {
  const r = (ang * Math.PI) / 180, back = 600 + i * 60, off = (i - 1) * 64;
  const x1 = tipX - Math.cos(r) * back - Math.sin(r) * off, y1 = tipY - Math.sin(r) * back + Math.cos(r) * off;
  const x2 = tipX - Math.cos(r) * (back + 200) - Math.sin(r) * off, y2 = tipY - Math.sin(r) * (back + 200) + Math.cos(r) * off;
  s += `<line x1="${f1(x1)}" y1="${f1(y1)}" x2="${f1(x2)}" y2="${f1(y2)}" stroke="${INK}" stroke-width="12" stroke-linecap="round"/>`;
}
s += `<g transform="translate(${tipX} ${tipY}) rotate(${ang})">
  <path d="M -520 -36 L -160 -36 L -160 -96 L 0 0 L -160 96 L -160 36 L -520 36 Z" fill="${C.a300}" stroke="${INK}" stroke-width="12" stroke-linejoin="round"/>
  <path d="M -160 -96 L 0 0 L -160 96 Z" fill="${C.r600}" stroke="${INK}" stroke-width="12" stroke-linejoin="round"/>
</g>`;
document.getElementById('art').innerHTML = s;
window.ready = document.fonts.ready;
</script>
</body>
</html>
