# Roda o npm test (tools/testar.cjs) a cada push e PR: episódios desenham sem erro, data.js bate com o
# narracao.txt, corte.json válido e nenhum corte começando no meio da fala.
name: testes
on:
  push:
    branches: [main]
  pull_request:
jobs:
  testes:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
