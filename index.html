<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>PregaAI vídeos</title>
<style>
@font-face { font-family: Geist; src: url(node_modules/@expo-google-fonts/geist/500Medium/Geist_500Medium.ttf); font-weight: 500; }
@font-face { font-family: Geist; src: url(node_modules/@expo-google-fonts/geist/600SemiBold/Geist_600SemiBold.ttf); font-weight: 600; }
@font-face { font-family: Geist; src: url(node_modules/@expo-google-fonts/geist/700Bold/Geist_700Bold.ttf); font-weight: 700; }
@font-face { font-family: Geist; src: url(node_modules/@expo-google-fonts/geist/800ExtraBold/Geist_800ExtraBold.ttf); font-weight: 800; }
@font-face { font-family: Lora; src: url(node_modules/@expo-google-fonts/lora/600SemiBold/Lora_600SemiBold.ttf); font-weight: 600; }
@font-face { font-family: Lora; src: url(node_modules/@expo-google-fonts/lora/500Medium_Italic/Lora_500Medium_Italic.ttf); font-weight: 500; font-style: italic; }
@font-face { font-family: 'Gasoek One'; src: url(node_modules/@expo-google-fonts/gasoek-one/400Regular/GasoekOne_400Regular.ttf); }
@font-face { font-family: 'Geist Mono'; src: url(node_modules/@expo-google-fonts/geist-mono/500Medium/GeistMono_500Medium.ttf); font-weight: 500; }
@font-face { font-family: 'Geist Mono'; src: url(node_modules/@expo-google-fonts/geist-mono/600SemiBold/GeistMono_600SemiBold.ttf); font-weight: 600; }

/* Tokens da marca (docs/design.md): neutros do PregaAI, azul #2383E2 com a
   escala pastel, borda 1px + sombra dura sem blur, cantos 16/12/8. Tudo
   multiplicado por ~2,77 (o vídeo tem 1080 px, a tela medida tinha 390). */
:root {
  --paper: #F8F7F4; --surface: #FFFFFF; --ink: #37352F; --ink-deep: #181614; --muted: #87857F; --border: #D2D1CE;
  --b300: #AAD1FF; --b500: #2383E2; --b600: #0675D3;
  --d-surface: #202020; --d-border: #0C0C0C; --d-ink: #EDEDEB; --d-muted: #9B9A96;
}
html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: var(--paper); }
#root { position: relative; width: 1080px; height: 1920px; overflow: hidden; -webkit-font-smoothing: antialiased; font-family: Geist; color: var(--ink); }
#stage, .layer { position: absolute; inset: 0; }
.eyebrow { font: 600 28px/1 Geist; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }

/* referência discreta e legenda só com o texto */
.ref { position: absolute; left: 0; right: 0; top: 214px; text-align: center; font: 500 30px/1 'Geist Mono'; letter-spacing: 0.06em; color: var(--muted); }
.dark .ref { color: #A8A7A3; }
.cap { position: absolute; left: 50%; top: 1286px; width: 900px; text-align: center; font: 800 70px/1.16 Geist; letter-spacing: -0.02em;
  color: var(--ink); text-shadow: 0 2px 0 rgba(255, 255, 255, 0.5); }
.cap .now { color: var(--b500); }
.dark .cap { color: #F4F3F0; text-shadow: 0 2px 10px rgba(0, 0, 0, 0.55); }
.dark .cap .now { color: #6FB1FC; }

/* contador (KPI da marca: 700, tabular, tracking -0.025em) */
.kpi { position: absolute; right: 60px; top: 410px; padding: 28px 36px 26px; background: var(--surface); border: 3px solid var(--border);
  border-radius: 40px; box-shadow: 0 10px 0 0 var(--border); text-align: right; }
.kpi-n { font: 700 150px/1 Geist; letter-spacing: -0.025em; font-variant-numeric: tabular-nums; color: var(--ink-deep); margin-top: 10px; min-width: 300px; }

.giant { position: absolute; left: 50%; top: 700px; font: 400 230px/1 'Gasoek One'; color: var(--ink-deep); white-space: nowrap; }
.giant span { color: var(--b500); }

/* selo de sucesso (verde da paleta base: fill 300, edge 600) */
.stamp { position: absolute; left: 50%; top: 470px; display: flex; align-items: center; gap: 18px; padding: 22px 36px 26px; white-space: nowrap;
  border-radius: 30px; font: 800 58px/1 Geist; letter-spacing: -0.02em; color: var(--ink-deep); transform-origin: 50% 50%; }
.stamp.ok { background: #A1E0A9; border: 4px solid #319751; box-shadow: 0 10px 0 0 #319751; }

/* cartão de versículo: texto bíblico em Lora (Typography.serif do app) */
.verse { position: absolute; left: 50%; width: 930px; box-sizing: border-box; background: var(--surface); border: 3px solid var(--border);
  border-radius: 44px; box-shadow: 0 10px 0 0 var(--border); padding: 40px 50px 44px; }
.verse.small { top: 400px; }
.verse.big { top: 430px; padding: 56px 60px 60px; }
.verse .vtext { font: 600 50px/1.3 Lora; color: var(--ink-deep); margin: 18px 0 22px; }
.verse.big .vtext { font-size: 72px; line-height: 1.24; margin: 24px 0 30px; }
.verse .vref { font: 500 30px/1 'Geist Mono'; color: var(--muted); }
mark { background: linear-gradient(var(--b300), var(--b300)) no-repeat; background-size: var(--p, 0%) 100%; color: inherit; padding: 0; border-radius: 0;
  -webkit-box-decoration-break: clone; box-decoration-break: clone; }

/* lista dos valentes */
.list { position: absolute; left: 60px; right: 60px; top: 390px; background: var(--surface); border: 3px solid var(--border); border-radius: 44px;
  box-shadow: 0 10px 0 0 var(--border); overflow: hidden; }
.lhead { padding: 38px 44px 30px; border-bottom: 3px solid #ECEAE6; }
.ltitle { font: 700 52px/1.15 Geist; letter-spacing: -0.02em; color: var(--ink-deep); margin-top: 14px; }
.lrow { display: flex; align-items: center; gap: 24px; padding: 22px 44px; border-bottom: 3px solid #F1EFEB; }
.lrow:last-child { border-bottom: 0; }
.lnum { width: 56px; height: 56px; flex: none; border-radius: 16px; background: #F1F0ED; display: grid; place-items: center; font: 600 28px 'Geist Mono'; color: var(--muted); }
.lname { flex: 1; font: 600 42px/1.2 Geist; color: var(--ink); }
.lref { flex: none; font: 500 28px 'Geist Mono'; color: var(--muted); }
.lrow.vrow { background: #FBFAF8; }
.lrow.vrow .vtext { flex: 1; font: 600 44px/1.3 Lora; color: var(--ink-deep); margin: 0; padding-left: 80px; }
.lord { display: inline-block; font-weight: 600; }
.lord.on { background: var(--b500); color: #fff; border-radius: 14px; padding: 0 12px 2px; box-shadow: 0 5px 0 0 var(--b600); }

/* cartão final */
.end { position: absolute; left: 0; right: 0; top: 400px; display: flex; flex-direction: column; align-items: center; }
.logo { display: flex; align-items: center; gap: 30px; height: 140px; }
.logo .fish { width: 250px; height: 125px; }
.logo .wm { width: 470px; height: 64px; }
.end-head { margin-top: 64px; font: 800 64px/1.1 Geist; letter-spacing: -0.02em; color: var(--ink-deep); }
.end-refs { display: flex; gap: 18px; margin-top: 28px; }
.app { margin-top: 56px; width: 820px; box-sizing: border-box; padding: 40px 44px 44px; background: var(--surface); border: 3px solid var(--border); border-radius: 44px;
  box-shadow: 0 10px 0 0 var(--border); display: flex; flex-direction: column; align-items: center; }
.app-row { display: flex; align-items: center; gap: 32px; align-self: stretch; }
.app-icon { width: 150px; height: 150px; border-radius: 36px; border: 3px solid var(--b600); box-shadow: 0 8px 0 0 var(--b600); }
.app-name { font: 700 58px/1.1 Geist; letter-spacing: -0.02em; color: var(--ink-deep); }
.app-desc { margin-top: 10px; font: 500 36px/1.25 Geist; color: var(--muted); }
.play { margin-top: 34px; width: 500px; }
.follow { margin-top: 48px; font: 600 40px/1 Geist; color: var(--b500); }
.legal { position: absolute; left: 0; right: 0; top: 1478px; text-align: center; font: 500 22px/1.3 Geist; color: var(--muted); }
.end-refs span { padding: 12px 22px; background: var(--surface); border: 3px solid var(--border); border-radius: 18px; box-shadow: 0 6px 0 0 var(--border);
  font: 600 36px/1.2 'Geist Mono'; color: var(--ink); }
</style>
</head>
<body>
<div id="root"><svg id="stage" viewBox="0 0 1080 1920" width="1080" height="1920"></svg><div id="scene" class="layer"></div><div id="chrome" class="layer"></div></div>
<script src="lib.js"></script>
<script>
// O episódio vem da URL: index.html?ep=valentes-de-davi-2
const EP = new URLSearchParams(location.search).get('ep');
document.write(`<script src="episodios/${EP}/data.js"><\/script><script src="episodios/${EP}/scenes.js"><\/script>`);
</script>
<script>
const CHUNKS = buildChunks(SEGS);
const $stage = document.getElementById('stage'), $scene = document.getElementById('scene'), $chrome = document.getElementById('chrome');

function activeScenes(t) {
  const out = [];
  SCENES.forEach((sc, i) => {
    const a = i === 0 ? -1 : sc.a - XF / 2, b = sc.end ? 1e9 : sc.b + XF / 2;
    if (t >= a && t < b) out.push({ sc, op: i === 0 ? 1 : E.sine(prog(t, sc.a - XF / 2, sc.a + XF / 2)) });
  });
  return out;
}
const refAt = (sc, t) => (Array.isArray(sc.ref) ? sc.ref.filter(([t0]) => t >= t0).pop() : sc.ref ? [sc.a, sc.ref] : null);

// Legenda: só o texto; a palavra que está sendo falada fica azul.
function captionHTML(t) {
  const i = CHUNKS.findIndex((c) => t >= c.t0 && t < c.t1);
  if (i < 0) return '';
  const c = CHUNKS[i];
  if (c.hidden) return '';
  const next = CHUNKS[i + 1];
  const cut = next && Math.abs(next.t0 - c.t1) < 1e-6;
  const pin = E.out(prog(t, c.t0, c.t0 + 0.12)), pout = cut ? 1 : 1 - prog(t, c.t1 - 0.16, c.t1);
  const now = t > c.segEnd + 0.05 ? -1 : c.words.reduce((k, x, j) => (t >= x.t ? j : k), -1);
  const h = c.words.map((x, j) => `<span${j === now ? ' class="now"' : ''}>${esc(x.w)}</span>`).join(' ');
  return `<div class="cap" style="opacity:${f1(Math.min(pin, pout) * 100) / 100};transform:translateX(-50%) translateY(${f1((1 - pin) * 12)}px)">${h}</div>`;
}

// A referência aparece discreta no alto, por alguns segundos, quando a passagem muda.
function chromeHTML(t, list) {
  const top = list[list.length - 1];
  const cur = top.op >= 0.5 || list.length === 1 ? top.sc : list[0].sc;
  if (cur.end) return { html: '', dark: false };
  let h = '';
  const r = refAt(cur, t);
  if (r) {
    const t0 = Math.max(r[0], cur.a);
    const p = E.out(prog(t, t0 + 0.2, t0 + 0.7)) * (1 - prog(t, t0 + 3.4, t0 + 4.0));
    if (p > 0) h += `<div class="ref" style="opacity:${f1(p * 100) / 100}">${esc(r[1])}</div>`;
  }
  h += captionHTML(t);
  return { html: h, dark: typeof cur.dark === 'function' ? cur.dark(t) : !!cur.dark };
}

window.renderFrame = (t) => {
  const list = activeScenes(t);
  let svg = DEFS, html = '';
  list.forEach(({ sc, op }) => {
    const r = sc.f(t);
    svg += op < 1 ? `<g opacity="${op.toFixed(3)}">${r.svg}</g>` : r.svg;
    if (r.html) html += `<div class="layer" style="opacity:${op.toFixed(3)}">${r.html}</div>`;
  });
  $stage.innerHTML = svg;
  $scene.innerHTML = html;
  const ch = chromeHTML(t, list);
  $chrome.className = 'layer' + (ch.dark ? ' dark' : '');
  $chrome.innerHTML = ch.html;
};
window.ready = (async () => {
  const fams = ['500 40px Geist', '600 40px Geist', '700 40px Geist', '800 40px Geist', '600 40px Lora', 'italic 500 40px Lora', '40px "Gasoek One"', '500 40px "Geist Mono"', '600 40px "Geist Mono"'];
  await Promise.all(fams.map((f) => document.fonts.load(f)));
  await document.fonts.ready;
  return true;
})();
</script>
</body>
</html>
